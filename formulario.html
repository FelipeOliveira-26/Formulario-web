<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário Completo</h1>

    <form>
      <fieldset>
        <legend>Dados Pessoais</legend>
        <label>Nome:</label> 
          <input type="text">
        <label>Sobrenome:</label> 
          <input type="text">
        <label>Email:</label> 
          <input type="text">
        <label>Telefone:</label> 
          <input type="number">
        <label>Aniversário:</label> 
          <input type="date"> <
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <label>Rua:</label> 
          <input type="text">
        <label>Número:</label> 
          <input type="text">
        <label>Cidade:</label> 
          <input type="text">
        <label>Estado:</label> 
          <input type="text">
        <label>CEP:</label> 
          <input type="number">
      </fieldset>

      <fieldset>
        <legend>Preferências</legend>
        <label>Cor Favorita: </label>
        <select>
            <option>--Nenhum--</option>
            <option>Vermelho</option>
            <option>Azul</option>
            <option>Verde</option>
            <option>Amarelo</option>
         </select>
            <br>
           <label>Gênero: </label>
            <input type="radio" value="m" name="genero"/>
            <label class="baixo">Masculino </label>
            <input type="radio" value="f" name="genero"/>
            <label class="baixo">Feminino </label><br>

            <label>Interesses: </label>
            <input type="checkbox" value="esportes">
            <label class="baixo">Esportes</label><br>
            <input type="checkbox" value="musica">
            <label class="baixo">Música</label><br>
            <input type="checkbox" value="tecnologia">
            <label class="baixo">Tecnologia</label>
      </fieldset>

      <fieldset>
        <legend>Upload de Arquivos</legend>
        <input type="file">
      </fieldset>

      <fieldset>
        <legend>Informações de login</legend>
        <label>Nome de Usuário:</label>
          <input type="text">
        <label>Senha:</label> 
          <input type="password">
        <label>Confirmar Senha:</label> 
          <input type="password">
      </fieldset><br>

      <input type="submit" value="Enviar">

    </form>
    
</body>
</html>
